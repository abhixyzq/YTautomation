name: 🚀 Autonomous Daily Tech Shorts

on:
  schedule:
    # 3 times daily with 25-30 min pre-buffer (UTC to IST):
    # 03:05 UTC = 08:35 AM IST (Pre-buffers for 09:00 AM Morning Tech Drop)
    # 09:05 UTC = 02:35 PM IST (Pre-buffers for 03:00 PM Afternoon Push)
    # 14:35 UTC = 08:05 PM IST (Pre-buffers for 08:30 PM Evening Peak Drop)
    - cron: '5 3 * * *'
    - cron: '5 9 * * *'
    - cron: '35 14 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-color-emoji

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Securely Inject Secrets & OAuth Credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY || 'Y8PSKU5ua4A75zQRA6EHOZ9FcAySv9U6' }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> .env
          echo "GIPHY_API_KEY=$GIPHY_API_KEY" >> .env
          echo "VOICE_NAME=en-US-BrianMultilingualNeural" >> .env
          echo "VOICE_RATE=+2%" >> .env
          echo "VOICE_PITCH=+0Hz" >> .env
          echo "LANGUAGE=ENG" >> .env
          echo "PUBLISH_MODE=PUBLIC" >> .env
          echo "YOUTUBE_CLIENT_SECRET_FILE=client_secret.json" >> .env
          echo "INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" >> .env
          echo "INSTAGRAM_ACCESS_TOKEN=$INSTAGRAM_ACCESS_TOKEN" >> .env

          echo "$CLIENT_SECRET_JSON" > client_secret.json
          echo "$TOKEN_JSON" > token.json

      - name: 🎬 Render 4K Documentary & Auto-Publish to YouTube
        run: |
          python main.py --publish

      - name: 💾 Commit & Sync Published Story History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/published_history.json || true
          git commit -m "chore(history): update published story log [skip ci]" || exit 0
          git push || true

      - name: 🧹 Clean Up Ephemeral Secrets
        if: always()
        run: |
          rm -f .env client_secret.json token.json
