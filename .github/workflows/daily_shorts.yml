name: 🚀 Autonomous Daily Tech Shorts (6 AM, 1 PM, 8 PM IST)

on:
  schedule:
    # 3 times daily (UTC to IST with anti-congestion pre-buffer so videos publish on time):
    # 00:20 UTC = 05:50 AM IST (Guarantees Morning Tech Short publishes by 06:00 AM IST)
    # 07:20 UTC = 12:50 PM IST (Guarantees Afternoon Tech Short publishes by 01:00 PM IST)
    # 14:20 UTC = 07:50 PM IST (Guarantees Prime Evening Tech Short publishes by 08:00 PM IST)
    - cron: '20 0 * * *'
    - cron: '20 7 * * *'
    - cron: '20 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI or Web Dashboard
    inputs:
      channel:
        description: 'Target Channel & Language'
        required: true
        default: 'tech'
        type: choice
        options:
          - tech
          - dastawez
      mode:
        description: 'Video Format'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      topic:
        description: 'Custom Topic / Angle (Leave empty for auto-trending news)'
        required: false
        default: ''
      duration:
        description: 'Target Duration in minutes (for Long Episode)'
        required: false
        default: '12'
      publish:
        description: 'Publish directly to YouTube'
        required: true
        type: boolean
        default: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-indic fonts-dejavu-core fonts-liberation fonts-noto-color-emoji libraqm0 libraqm-dev libfribidi0 libharfbuzz0b

      - name: ⚙️ Set up Node.js 20 for Remotion Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📦 Install Remotion Node Dependencies
        run: npm ci

      - name: 🔐 Securely Inject Secrets & OAuth Credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY || 'Y8PSKU5ua4A75zQRA6EHOZ9FcAySv9U6' }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          TOKEN_DASTAWEZ_JSON: ${{ secrets.TOKEN_DASTAWEZ_JSON || secrets.TOKEN_JSON }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> .env
          echo "GIPHY_API_KEY=$GIPHY_API_KEY" >> .env
          echo "VOICE_NAME=en-US-BrianMultilingualNeural" >> .env
          echo "VOICE_RATE=+2%" >> .env
          echo "VOICE_PITCH=+0Hz" >> .env
          echo "LANGUAGE=ENG" >> .env
          echo "PUBLISH_MODE=PUBLIC" >> .env
          echo "YOUTUBE_CLIENT_SECRET_FILE=client_secret.json" >> .env
          echo "YOUTUBE_TOKEN_FILE=token.json" >> .env
          echo "YOUTUBE_TOKEN_DASTAWEZ_FILE=token_dastawez.json" >> .env
          echo "INSTAGRAM_ACCOUNT_ID=$INSTAGRAM_ACCOUNT_ID" >> .env
          echo "INSTAGRAM_ACCESS_TOKEN=$INSTAGRAM_ACCESS_TOKEN" >> .env

          echo "$CLIENT_SECRET_JSON" > client_secret.json
          echo "$TOKEN_JSON" > token.json
          echo "$TOKEN_DASTAWEZ_JSON" > token_dastawez.json

      - name: 🎬 Render Video & Auto-Publish
        run: |
          # Pre-seed Remotion public assets directory with bundled audio
          mkdir -p public/assets/audio
          cp -r assets/audio/* public/assets/audio/ 2>/dev/null || true

          CHANNEL="tech"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ -n "${{ inputs.channel }}" ] && CHANNEL="${{ inputs.channel }}"
          fi
          CMD="python main.py --channel $CHANNEL"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            [ -z "$MODE" ] && MODE="short"
            CMD="$CMD --mode $MODE"
            if [ -n "${{ inputs.topic }}" ]; then
              CMD="$CMD --topic \"${{ inputs.topic }}\""
            fi
            if [ "$MODE" = "long" ]; then
              DURATION="${{ inputs.duration }}"
              [ -z "$DURATION" ] && DURATION="12"
              CMD="$CMD --duration $DURATION"
            fi
            if [ "${{ inputs.publish }}" = "true" ] || [ "${{ inputs.publish }}" = "True" ]; then
              CMD="$CMD --publish"
            else
              CMD="$CMD --dry-run"
            fi
          else
            # Scheduled cron run (Daily Short published automatically)
            CMD="$CMD --mode short --publish"
          fi
          echo "🚀 Executing pipeline command: $CMD"
          eval $CMD

      - name: 💾 Commit & Sync Published Story History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/published_history.json || true
          git commit -m "chore(history): update published story log [skip ci]" || exit 0
          git push || true

      - name: 🧹 Clean Up Ephemeral Secrets
        if: always()
        run: |
          rm -f .env client_secret.json token.json token_dastawez.json
