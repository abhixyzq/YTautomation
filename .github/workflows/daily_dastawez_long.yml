name: 🏛️ Autonomous Daily iDastawez Long Documentary (8 AM IST)

on:
  schedule:
    # Daily at 02:25 UTC = 07:55 AM IST (Explainer documentary renders and publishes right at 08:00 - 08:05 AM IST)
    - cron: '25 2 * * *'
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Specific Scheme ID (leave empty for auto-priority top topic)'
        required: false
        default: ''
      publish:
        description: 'Publish directly to @iDastawez on YouTube'
        required: true
        type: boolean
        default: true
      privacy:
        description: 'YouTube Privacy Status'
        required: true
        type: choice
        default: 'public'
        options:
          - public
          - unlisted
          - private
      force:
        description: 'Force run even if topic was covered previously'
        required: false
        type: boolean
        default: false
      engine:
        description: 'Render Engine (moviepy = 2-3 min ultra-fast, remotion = browser)'
        required: false
        type: choice
        default: 'moviepy'
        options:
          - moviepy
          - remotion

jobs:
  build-and-publish-long:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System Dependencies (FFmpeg & Hindi Devanagari Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-indic fonts-noto-core fonts-noto-color-emoji

      - name: ⚙️ Set up Node.js 20 for Remotion Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📦 Install Remotion Node Dependencies
        run: npm ci

      - name: 🔐 Securely Inject @iDastawez Credentials & API Keys
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_DASTAWEZ_JSON: ${{ secrets.TOKEN_DASTAWEZ_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "$CLIENT_SECRET_JSON" > client_secret.json
          echo "$TOKEN_DASTAWEZ_JSON" > token_dastawez.json
          [ -n "$GEMINI_API_KEY" ] && echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env || true
          [ -n "$PEXELS_API_KEY" ] && echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> .env || true
          echo "Verified credential files injected:"
          ls -l client_secret.json token_dastawez.json

      - name: 🎬 Render iDastawez 16:9 Documentary & Auto-Publish
        env:
          INPUT_SCHEME: ${{ inputs.scheme }}
          INPUT_ENGINE: ${{ inputs.engine }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_PRIVACY: ${{ inputs.privacy }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          ARGS=()
          
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_ENGINE" ]; then
              ARGS+=(--engine "$INPUT_ENGINE")
            fi

            if [ -n "$INPUT_SCHEME" ]; then
              ARGS+=(--scheme "$INPUT_SCHEME")
            fi
            
            if [ "$INPUT_FORCE" = "true" ] || [ "$INPUT_FORCE" = "True" ]; then
              ARGS+=(--force)
            fi
            
            if [ "$INPUT_PUBLISH" = "true" ] || [ "$INPUT_PUBLISH" = "True" ]; then
              ARGS+=(--render --upload --privacy "$INPUT_PRIVACY")
            else
              ARGS+=(--render)
            fi
          else
            # Scheduled daily autonomous 16:9 documentary at 8:00 AM IST (Ultra-fast MoviePy engine)
            ARGS+=(--engine moviepy --render --upload --privacy public)
          fi
          
          echo "Executing: python run_dastawez.py" "${ARGS[@]}"
          python run_dastawez.py "${ARGS[@]}"

      - name: 📤 Upload Generated Video & Scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iDastawez-long-artifacts
          path: output/dastawez_episodes/
          retention-days: 7

      - name: 🧹 Clean Up Ephemeral Secrets
        if: always()
        run: |
          rm -f .env client_secret.json token_dastawez.json
