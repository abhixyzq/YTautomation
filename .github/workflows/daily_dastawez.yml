name: 🇮🇳 Autonomous Daily iDastawez Explainer

on:
  schedule:
    # Runs daily at 04:30 UTC = 10:00 AM IST (Prime morning time for government & citizen news)
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Specific Scheme ID (leave empty for auto-priority top topic)'
        required: false
        default: ''
      publish:
        description: 'Publish directly to @iDastawez'
        required: true
        type: boolean
        default: true
      privacy:
        description: 'YouTube Privacy Status'
        required: true
        type: choice
        default: 'public'
        options:
          - public
          - unlisted
          - private

jobs:
  build-and-publish-dastawez:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System Dependencies (FFmpeg & Hindi Devanagari Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-indic fonts-noto-core fonts-noto-color-emoji

      - name: ⚙️ Set up Node.js 20 for Remotion Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📦 Install Remotion Node Dependencies
        run: npm ci

      - name: 🔐 Securely Inject @iDastawez OAuth Credentials
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_DASTAWEZ_JSON: ${{ secrets.TOKEN_DASTAWEZ_JSON }}
        run: |
          echo "$CLIENT_SECRET_JSON" > client_secret.json
          echo "$TOKEN_DASTAWEZ_JSON" > token_dastawez.json
          echo "Verified credential files injected:"
          ls -l client_secret.json token_dastawez.json

      - name: 🎬 Render iDastawez Explainer & Auto-Publish
        run: |
          CMD="python run_dastawez.py"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.scheme }}" ]; then
              CMD="$CMD --scheme ${{ inputs.scheme }}"
            fi
            if [ "${{ inputs.publish }}" = "true" ] || [ "${{ inputs.publish }}" = "True" ]; then
              CMD="$CMD --render --upload --privacy ${{ inputs.privacy }}"
            else
              CMD="$CMD --dry-run"
            fi
          else
            # Scheduled daily autonomous run
            CMD="$CMD --render --upload --privacy public"
          fi
          
          echo "Executing: $CMD"
          eval $CMD
