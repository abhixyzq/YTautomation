name: 🇮🇳 Autonomous Daily iDastawez Engine (Hindi Shorts & Long Episodes)

on:
  schedule:
    # 00:20 UTC = 05:50 AM IST (Morning Hindi Short publishes by 06:00 AM IST)
    # 02:15 UTC = 07:45 AM IST (Daily Long Hindi Episode publishes by 08:00 AM IST)
    # 07:20 UTC = 12:50 PM IST (Afternoon Hindi Short publishes by 01:00 PM IST)
    # 14:20 UTC = 07:50 PM IST (Evening Prime Hindi Short publishes by 08:00 PM IST)
    - cron: '20 0 * * *'
    - cron: '15 2 * * *'
    - cron: '20 7 * * *'
    - cron: '20 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Video Format'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      topic:
        description: 'Custom Topic (Leave empty for auto-discovery)'
        required: false
        default: ''
      duration:
        description: 'Duration in minutes (for Long mode)'
        required: false
        default: '12'
      publish:
        description: 'Publish directly to @iDastawez on YouTube'
        required: true
        type: boolean
        default: true

jobs:
  build-and-publish-dastawez:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install System Dependencies (FFmpeg & Hindi Devanagari Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-deva fonts-indic fonts-dejavu-core fonts-liberation fonts-noto-color-emoji libraqm0 libraqm-dev libfribidi0 libharfbuzz0b

      - name: ⚙️ Set up Node.js 20 for Remotion Engine
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📦 Install Remotion Node Dependencies
        run: npm ci

      - name: 🔐 Securely Inject @iDastawez Credentials & API Keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY || 'Y8PSKU5ua4A75zQRA6EHOZ9FcAySv9U6' }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_DASTAWEZ_JSON: ${{ secrets.TOKEN_DASTAWEZ_JSON || secrets.TOKEN_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          set -euo pipefail
          : "${GEMINI_API_KEY:?GEMINI_API_KEY is not configured in repository secrets}"
          : "${CLIENT_SECRET_JSON:?CLIENT_SECRET_JSON is not configured in repository secrets}"
          : "${TOKEN_JSON:?TOKEN_JSON is not configured in repository secrets}"

          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> .env
          echo "GIPHY_API_KEY=$GIPHY_API_KEY" >> .env
          echo "VOICE_NAME_HI=hi-IN-MadhurNeural" >> .env
          echo "VOICE_RATE=+3%" >> .env
          echo "VOICE_PITCH=+0Hz" >> .env
          echo "PUBLISH_MODE=PUBLIC" >> .env
          echo "YOUTUBE_CLIENT_SECRET_FILE=client_secret.json" >> .env
          echo "YOUTUBE_TOKEN_DASTAWEZ_FILE=token_dastawez.json" >> .env
          echo "YOUTUBE_TOKEN_FILE=token.json" >> .env

          printf '%s\n' "$CLIENT_SECRET_JSON" > client_secret.json
          printf '%s\n' "$TOKEN_DASTAWEZ_JSON" > token_dastawez.json
          printf '%s\n' "$TOKEN_JSON" > token.json

      - name: 🔎 Validate YouTube OAuth credentials
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.publish == true || inputs.publish == 'true') }}
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
          TOKEN_DASTAWEZ_JSON: ${{ secrets.TOKEN_DASTAWEZ_JSON || secrets.TOKEN_JSON }}
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request

          client_raw = os.environ.get("CLIENT_SECRET_JSON", "")
          if not client_raw.strip():
              raise SystemExit("❌ CLIENT_SECRET_JSON is not configured in repository secrets")

          try:
              client = json.loads(client_raw)
          except Exception as e:
              raise SystemExit(f"❌ CLIENT_SECRET_JSON does not contain valid JSON: {e}")

          client_config = client.get("installed") or client.get("web") or {}
          client_id = client_config.get("client_id")
          if not client_id:
              raise SystemExit("❌ CLIENT_SECRET_JSON does not contain a client_id ('installed' or 'web')")

          # dastawez pipeline prioritizes TOKEN_DASTAWEZ_JSON, falling back to TOKEN_JSON
          token_secret_name = "TOKEN_DASTAWEZ_JSON"
          token_raw = os.environ.get(token_secret_name, "")
          if not token_raw.strip():
              token_secret_name = "TOKEN_JSON"
              token_raw = os.environ.get("TOKEN_JSON", "")

          if not token_raw.strip():
              raise SystemExit("❌ Neither TOKEN_DASTAWEZ_JSON nor TOKEN_JSON is configured")

          try:
              token = json.loads(token_raw)
          except Exception as e:
              raise SystemExit(f"❌ {token_secret_name} does not contain valid JSON: {e}")

          if not token.get("refresh_token"):
              raise SystemExit(f"❌ {token_secret_name} does not contain a 'refresh_token'. Authorized-user JSON with refresh token is required.")

          if token.get("client_id") and token["client_id"] != client_id:
              raise SystemExit(
                  f"❌ {token_secret_name} was generated from a different OAuth client!\n"
                  f"Token client_id: {token.get('client_id')}\n"
                  f"Secret client_id: {client_id}\n"
                  "Please regenerate token using the same client_secret.json."
              )

          print(f"✅ {token_secret_name} JSON structure and client_id match CLIENT_SECRET_JSON")

          print("🔄 Performing live token refresh test with Google OAuth endpoint for [DASTAWEZ]...")
          try:
              creds = Credentials.from_authorized_user_info(token)
              creds.refresh(Request())
              print(f"🎉 Live token refresh SUCCESS! Google accepted refresh token for {token_secret_name}.")
          except Exception as e:
              raise SystemExit(
                  f"\n❌ Google OAuth token refresh failed for {token_secret_name}: {e}\n"
                  "👉 The refresh token is expired, revoked, or unauthorized ('invalid_grant').\n"
                  "👉 Please regenerate your token locally using 'python generate_token.py --channel dastawez' and update the GitHub secret:\n"
                  f"   Secret name: {token_secret_name}\n"
                  "   Settings URL: https://github.com/abhixyzq/YTautomation/settings/secrets/actions\n"
              )
          PY

      - name: 🎬 Render Video & Auto-Publish to @iDastawez
        run: |
          # Pre-seed Remotion public assets directory with bundled audio
          mkdir -p public/assets/audio
          cp -r assets/audio/* public/assets/audio/ 2>/dev/null || true

          CMD="python main.py --channel dastawez"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            [ -z "$MODE" ] && MODE="short"
            CMD="$CMD --mode $MODE"
            if [ -n "${{ inputs.topic }}" ]; then
              CMD="$CMD --topic \"${{ inputs.topic }}\""
            fi
            if [ "$MODE" = "long" ]; then
              DURATION="${{ inputs.duration }}"
              [ -z "$DURATION" ] && DURATION="12"
              CMD="$CMD --duration $DURATION"
            fi
            if [ "${{ inputs.publish }}" = "true" ] || [ "${{ inputs.publish }}" = "True" ]; then
              CMD="$CMD --publish"
            else
              CMD="$CMD --dry-run"
            fi
          else
            # Cron schedule routing:
            # At 02:15 UTC, publish Long Episode (8:00 AM IST)
            # At 00:20, 07:20, 14:20 UTC, publish Shorts (6 AM, 1 PM, 8 PM IST)
            CRON_HOUR=$(date -u +%H)
            if [ "$CRON_HOUR" = "02" ]; then
              CMD="$CMD --mode long --duration 12 --publish"
            else
              CMD="$CMD --mode short --publish"
            fi
          fi
          
          echo "🚀 Executing iDastawez Hindi Pipeline: $CMD"
          eval $CMD

      - name: 💾 Commit & Sync Published Story History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/published_history.json || true
          git commit -m "chore(history): update published story log [skip ci]" || exit 0
          git push || true

      - name: 🧹 Clean Up Ephemeral Secrets
        if: always()
        run: |
          rm -f .env client_secret.json token_dastawez.json token.json
